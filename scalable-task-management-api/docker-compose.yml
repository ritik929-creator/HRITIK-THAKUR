services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      TASK_SERVICE_URL: http://task-service:8001
    depends_on:
      - task-service

  task-service:
    build: ./task-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/tasks
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  notification-service:
    build: ./notification-service
    ports:
      - "8002:8002"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
